<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>走四方｜退費處理系統</title><style>
:root{--ink:#193b3d;--teal:#167e79;--pale:#e9f5f2;--bg:#f5f8f7;--line:#dbe6e3;--warn:#fff3dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#263b3b;font:16px/1.65 system-ui,-apple-system,'Noto Sans TC',sans-serif}header{background:var(--ink);color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}header h1{font-size:24px;margin:0}header p{margin:4px 0 0;color:#cfe5e1;font-size:14px}.wrap{max-width:1050px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:230px 1fr;gap:20px}aside,.panel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 20px #143f3910}aside{padding:20px;height:max-content;position:sticky;top:18px}aside h3{margin:0 0 15px;font-size:15px}aside .nav{padding:9px 10px;border-left:3px solid #dbe6e3;color:#6c8380;font-size:14px}aside .nav.active{border-color:var(--teal);color:var(--ink);font-weight:700;background:var(--pale)}.panel{padding:27px;min-height:570px}h2{font-size:23px;color:var(--ink);margin:0 0 10px}h3{font-size:17px;color:var(--ink)}.sub{color:#667e7b;margin-top:0}.tag{display:inline-block;background:var(--pale);color:var(--teal);padding:3px 11px;border-radius:100px;font-size:13px;font-weight:700;margin-bottom:12px}.notice{background:var(--pale);border-left:4px solid var(--teal);padding:13px 16px;border-radius:8px;margin:16px 0}.warn{background:var(--warn);border-left-color:#d58b1e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-weight:650;font-size:14px;margin:8px 0 4px}input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #bdceca;border-radius:8px;background:white;color:#253d3a}textarea{min-height:86px}button{cursor:pointer;font:inherit;border-radius:9px;border:1px solid #bdd5d0;padding:10px 16px;background:white;color:var(--ink);font-weight:650}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.choices{display:grid;gap:10px;margin:18px 0}.choice{border:1px solid var(--line);padding:13px;border-radius:10px;display:flex;gap:10px;align-items:center}.choice{cursor:pointer;min-height:58px;user-select:none;transition:background .15s,border-color .15s}.choice:hover{background:#f0f8f6;border-color:#7eaaa2}.choice:has(input:checked){background:#e9f5f2;border-color:#167e79}.choice input[type=checkbox]{appearance:none;-webkit-appearance:none;width:28px;height:28px;min-width:28px;min-height:28px;padding:0;margin:0;border:2px solid #718f89;border-radius:7px;cursor:pointer;position:relative;flex-shrink:0}.choice input[type=checkbox]:checked{background:#167e79;border-color:#167e79}.choice input[type=checkbox]:checked:after{content:'✓';position:absolute;left:4px;top:-7px;font-size:26px;font-weight:800;color:white}.choice:focus-within{outline:3px solid #a8d9d0;outline-offset:2px}.script{background:#f7faf9;border:1px solid var(--line);padding:17px;border-radius:10px;white-space:pre-line}.small{font-size:13px;color:#6d807e}.money{font-size:25px;font-weight:800;color:var(--teal)}.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0}.hidden{display:none!important}#printArea{display:none}@media(max-width:740px){.wrap{display:block;margin:12px auto}aside{position:static;margin-bottom:12px}.panel{padding:18px}.grid{grid-template-columns:1fr}header{padding:17px 20px}}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;background:white;color:#111;font:12px/1.42 'Noto Sans TC',sans-serif;padding:5mm}#printArea h1{text-align:center;font-size:20px}#printArea h2{text-align:center;font-size:16px}#printArea p{margin:5px 0}#printArea h3{margin:9px 0 4px;font-size:13px}#printArea u{text-decoration:underline;text-underline-offset:2px}#printArea .signature{margin-top:22px;display:flex;justify-content:space-between}}
</style></head><body><header><h1>走四方｜退費處理系統 V2.1</h1><p>門市治療師操作版 · 退費協商 → 文件 → 退款 → 發票 → 財務 Kelly</p></header><div class="wrap"><aside><h3>案件處理進度</h3><div id="nav"></div><hr style="border:0;border-top:1px solid #e5eeeb;margin:20px 0"><div class="small">V2.1 測試版：資料只存在本瀏覽器，不會自動傳給 Kelly。公開網站請勿輸入真實顧客個資。</div><button style="margin-top:15px;width:100%" onclick="resetCase()">建立新案件</button></aside><main class="panel" id="app"></main></div><div id="printArea"></div><script>
const stages=['案件資料','退費協商','退款及付款方式','退費協議書','發票處理','通知 Kelly／結案'];const key='just4fun_refund_v2';const defaults={step:0,branch:'一般退費',tier:60,offers:[],status:'進行中',paid:0,deposit:3000,amount:0,customer:'',store:'',therapist:'',product:'',phone:'',date:'',purchaseDate:'',pickupDate:'',reason:'',payment:'',refundMethod:'',paymentNote:'',invoice:'',invoiceNote:'',kellyExtraNote:'',invoiceOld:'',invoiceNew:'',refundDate:'',refundProof:'',refundDone:false,agreementSigned:false,invoiceDone:false,docsFiled:false,kellySent:false,supervisorNotified:false,supervisorApproved:false,supervisorNotes:'',customerDecision:'',considerDate:'',considerNote:'',refundIssues:'',specialEscalation:false,coveredDispute:'本次鞋墊消費及退費金額爭議'};let d;try{d={...defaults,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){d={...defaults}}const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(d));function field(k){let e=$(k);if(e){d[k]=e.type==='checkbox'?e.checked:e.value;save()}}function bind(){document.querySelectorAll('[data-key]').forEach(e=>{e.addEventListener('change',()=>{field(e.dataset.key);render()});if(e.tagName==='INPUT'||e.tagName==='TEXTAREA')e.addEventListener('input',()=>{field(e.dataset.key);if(e.dataset.key==='kellyExtraNote'&&$('kellyText'))$('kellyText').textContent=kellyText()})})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function inp(k,title,type='text',extra=''){return `<div><label for="${k}">${title}</label><input id="${k}" data-key="${k}" type="${type}" value="${esc(d[k])}" ${extra}></div>`}function sel(k,title,opts){return `<div><label>${title}</label><select id="${k}" data-key="${k}"><option value="">請選擇</option>${opts.map(x=>`<option ${d[k]===x?'selected':''}>${x}</option>`).join('')}</select></div>`}function txt(k,title){return `<div><label>${title}</label><textarea id="${k}" data-key="${k}">${esc(d[k])}</textarea></div>`}function next(n){d.step=n;save();render();window.scrollTo(0,0)}function buttons(back,forward,disabled=false){return `<div class="actions">${back>=0?`<button onclick="next(${back})">← 上一步</button>`:''}<button class="primary" ${disabled?'disabled':''} onclick="next(${forward})">下一步 →</button></div>`}function money(n){return Math.round(Number(n)||0).toLocaleString('zh-TW')}function amt(){return Math.round((+d.paid||0)*(+d.tier||0)/100)}function retained(){return (+d.paid||0)-amt()}function render(){save();$('nav').innerHTML=stages.map((x,i)=>`<div class="nav ${i===d.step?'active':''}">${i+1}. ${x}</div>`).join('');let s='<span class="tag">STEP '+(d.step+1)+' / 6</span>';if(d.step===0){s+=`<h2>建立退費案件</h2><p class="sub">顧客已明確提出退款要求時，開始此流程。若僅反映不適，仍依一般售後服務處理。</p><div class="grid">${inp('customer','顧客姓名')}${sel('store','門市',['台北','板橋','竹北','台中','員林','台南'])}${inp('therapist','負責治療師')}${inp('phone','顧客電話')}${sel('product','鞋墊種類',['成人全訂製','兒童全訂製','成人半訂製','兒童半訂製','個人化半訂製','進階半訂製','其他'])}${inp('paid','實際已付款總金額（元）','number','min="0"')}${inp('deposit','其中訂金（元）','number','min="0"')}${inp('purchaseDate','訂購日期','date')}${inp('pickupDate','取件日期','date')}</div>${txt('reason','顧客提出退費的原因')}<div class="notice">請先讓主管知悉本案。60%～70%協商可依既定授權辦理；超過70%必須經主管核准。</div><label class="choice"><input type="checkbox" id="supervisorNotified" data-key="supervisorNotified" ${d.supervisorNotified?'checked':''}> 已通知主管知悉</label>${buttons(-1,1,!d.customer||!d.store||!d.therapist||!(+d.paid>0)||!d.supervisorNotified)}`}
else if(d.step===1){s+=`<h2>退費協商｜${d.tier}%</h2><p class="sub">一般案件依60% → 70%協商；超過70%必須由主管核准。</p><div class="row"><span>實際已付款</span><b>NT$ ${money(d.paid)}</b></div><div class="row"><span>目前提出退款 ${d.tier}%</span><b class="money">NT$ ${money(amt())}</b></div><h3>建議溝通說詞</h3><div class="script">${esc(scriptText())}</div>${d.tier===70?'<div class="notice">請先實際確認門市退費處理規範，再向顧客說明70%為門市最高協商權限；勿虛稱已獲總公司個案核准。</div>':''}<h3>顧客回應</h3>${d.status==='待顧客回覆'?`<div class="notice warn"><b>顧客需要時間考慮，暫停協商</b><div class="grid">${inp('considerDate','預計追蹤日期','date')}${inp('considerNote','追蹤備註')}</div><button onclick="d.status='進行中';save();render()">顧客已回覆，繼續協商</button></div>`:d.status==='待主管審核'?`<div class="notice warn"><b>超過70%需主管核准</b>${txt('supervisorNotes','主管處理紀錄／核准內容')}<div class="grid">${inp('tier','主管核准退款比例（%）','number','min="71" max="100"')}<label class="choice"><input type="checkbox" id="supervisorApproved" data-key="supervisorApproved" ${d.supervisorApproved?'checked':''}> 已取得主管明確核准</label></div><button class="primary" onclick="approved()">確認核准並進入退款作業</button></div>`:`<div class="actions"><button class="primary" onclick="accept()">✓ 顧客接受 ${d.tier}%</button><button onclick="reject()">✕ 顧客不接受</button><button onclick="consider()">◷ 需要時間考慮</button></div>`}<div class="notice warn"><b>特殊狀況：</b>如顧客反映新的傷害、商品明顯瑕疵或與約定不符，請保留事證並由主管另外評估；60%／70%協商比例不是依法應負責任的上限。<div class="actions"><button onclick="escalate()">涉及瑕疵／傷害，轉主管處理</button></div></div>${d.specialEscalation?`<div class="notice">${txt('refundIssues','特殊爭議與主管處理紀錄')}<button onclick="d.specialEscalation=false;save();render()">已記錄，返回協商</button></div>`:''}<div class="actions"><button onclick="next(0)">← 返回案件資料</button></div>`}
else if(d.step===2){s+=`<h2>退款金額與付款方式</h2><div class="row"><span>原實際付款</span><b>NT$ ${money(d.paid)}</b></div><div class="row"><span>協議退款比例</span><b>${d.tier}%</b></div><div class="row"><span>應退顧客</span><b class="money">NT$ ${money(amt())}</b></div><div class="row"><span>公司保留</span><b>NT$ ${money(retained())}</b></div><div class="grid">${sel('payment','原付款方式',['現金／銀行轉帳','信用卡','LINE Pay','台灣 Pay','混合付款'])}${sel('refundMethod','預計退款方式',['現金','銀行轉帳','原信用卡退刷','LINE Pay 原交易退款','台灣 Pay 原交易退款','其他／例外處理'])}</div>${txt('paymentNote','交易編號、授權碼、原付款拆分、平台退款限制及備註')}<div class="notice warn">信用卡、LINE Pay、台灣 Pay 的部分退款能力、期限及手續費，依實際收單機構與交易紀錄確認。無法依原交易退款時，請先取得主管／財務確認，不可自行改變已協議的退款金額。</div>${buttons(1,3,!d.payment||!d.refundMethod)}`}
else if(d.step===3){s+=`<h2>退費協議暨確認書</h2><p class="sub">選擇 B 方案：系統自動帶入資料，列印 A4 供顧客閱讀、簽名。請在實際退款前完成。</p><div class="notice">文件將自動帶入：${esc(d.customer)}｜${esc(d.store)}｜${esc(d.product)}｜實付 NT$ ${money(d.paid)}｜退費 ${d.tier}%（NT$ ${money(amt())}）。</div>${txt('coveredDispute','本次協議涵蓋的爭議事項（特殊爭議請具體描述）')}<div class="actions"><button class="primary" onclick="printAgreement()">列印已填妥的退費協議書</button></div><label class="choice"><input type="checkbox" id="agreementSigned" data-key="agreementSigned" ${d.agreementSigned?'checked':''}> 已由顧客閱讀並簽署退費協議書</label><div class="notice warn">協議僅處理明確列出的事項；涉及商品瑕疵、傷害或其他法定責任，應另由主管確認。</div>${buttons(2,4,!d.agreementSigned)}`}
else if(d.step===4){s+=`<h2>實際退款及電子發票</h2><p class="sub">現場治療師負責執行退款、保存交易憑證並處理發票。</p><div class="grid">${inp('refundDate','實際退款日期','date')}${inp('refundProof','退款交易編號／憑證號碼')}${sel('invoice','發票查詢狀態',['訂金與尾款發票皆可查得','僅查得尾款發票','僅查得訂金發票','兩張皆暫時查不到','單張發票／未分拆'])}${inp('invoiceOld','原發票號碼（可多筆）')}${inp('invoiceNew','新發票號碼／折讓單號')}</div>${txt('invoiceNote','發票處理說明／找不到訂金發票的查詢結果')}<div class="notice warn">公司原作法為「原發票作廢、重開保留金額」。但已開立或跨期的電子發票是否能作廢，應依實際交易及稅務規定確認；部分退款可能須折讓。找不到訂金發票時，先查電子發票紀錄，可先退款並標記「待 Kelly 確認」，不可將超過尾款發票金額的折讓硬套到尾款發票。</div><label class="choice"><input type="checkbox" id="refundDone" data-key="refundDone" ${d.refundDone?'checked':''}> 已依協議完成實際退款，並保存退款憑證</label><label class="choice"><input type="checkbox" id="invoiceDone" data-key="invoiceDone" ${d.invoiceDone?'checked':''}> 發票已依適用規則處理完成（若待財務確認，請勿勾選）</label>${buttons(3,5,!d.refundDone||!d.invoice||!d.refundDate||!d.agreementSigned)}`}
else{let msg=kellyText();s+=`<h2>通知 Kelly／財務確認</h2><p class="sub">僅回報財務摘要、退費原因及需要處理的例外。正常作業不另外列出。</p>${txt('kellyExtraNote','特殊備註（選填）')}<p class="small">只填寫網頁流程未涵蓋、需要特別交代的帳務事項；已在前面選擇的發票或付款異常會自動帶入。</p><h3>LINE 回報預覽</h3><div class="script" id="kellyText">${esc(msg)}</div><div class="actions"><button class="primary" onclick="copyKelly()">複製 Kelly 回報內容</button></div><label class="choice"><input type="checkbox" id="kellySent" data-key="kellySent" ${d.kellySent?'checked':''}> 已實際將上述內容傳給 Kelly</label><label class="choice"><input type="checkbox" id="docsFiled" data-key="docsFiled" ${d.docsFiled?'checked':''}> 已將簽署文件、退款憑證歸檔，並更新相關紀錄／績效表</label>${!d.invoiceDone?'<div class="notice warn">發票尚待財務確認：案件可標示「門市退款完成／待財務確認」，不可標記為全部結案。</div>':''}<div class="notice"><b>案件狀態：</b>${d.refundDone&&d.kellySent&&d.docsFiled?(d.invoiceDone?'全部結案':'門市退款完成／待財務確認'):'待完成行政作業'}</div><div class="actions"><button onclick="next(4)">← 上一步</button><button onclick="exportJSON()">匯出案件紀錄 JSON</button><button onclick="printAgreement()">重新列印協議書</button></div>`} $('app').innerHTML=s;bind()}
function scriptText(){if(d.tier===60)return '我們知道這段時間您也花了不少時間，最後還是沒能達到您的期待，這樣的結果其實也是我們不願意看到的。\n\n這段過程我們也投入了很多心力，希望能盡量把事情處理好。\n\n所以這次我們願意退還您60%的費用，不知道您覺得這樣可以接受嗎？';return '我們也希望能盡量協助您，所以我特別再確認了一下，目前門市能提供的最高退費比例就是70%。\n\n其實從評估、製作到後續調整，我們也投入了不少人力、物力和心力。退到這個比例，公司其實也承擔了相當大的負擔。\n\n這已經是我們目前能展現的最大誠意，也希望雙方能互相體諒，一起承擔這次不如預期的結果。\n\n不知道這樣的方式，您是否願意接受呢？'}function escalate(){d.specialEscalation=true;d.supervisorNotified=true;save();render()}
function accept(){d.offers.push({tier:d.tier,result:'接受',time:new Date().toISOString()});d.status='已接受';next(2)}function reject(){d.offers.push({tier:d.tier,result:'不接受',time:new Date().toISOString()});if(d.tier<70){d.tier=70;render()}else{d.status='待主管審核';render()}}function consider(){d.offers.push({tier:d.tier,result:'需要時間考慮',time:new Date().toISOString()});d.status='待顧客回覆';render()}function approved(){if(!d.supervisorApproved||!(+d.tier>70&&+d.tier<=100)){alert('請填寫大於70%、不超過100%的核准比例，並確認主管已核准。');return}d.status='主管核准';next(2)}function agreementHTML(){return `<h1>走四方客製鞋墊</h1><h2>退費協議暨確認書</h2><p>親愛的顧客，您好：</p><p>謝謝您曾經選擇走四方，也謝謝您這段時間願意與我們一起努力，尋找適合您的鞋墊。</p><p>我們一直希望每位顧客都能獲得良好的使用體驗，但每個人的足部狀況、穿著感受與需求不同，即使經過評估、製作及調整，有時仍無法達到原本的期待。對於這次的結果，我們感到很遺憾。相信這樣的情況，是您和我們都不願意遇到的。</p><p>雖然最後未能達到彼此期待的結果，但我們仍希望透過相互理解與體諒，為這次的消費經驗畫下一個圓滿的句點。</p><h3>一、退費內容</h3><p>顧客姓名：${esc(d.customer)}　　消費門市：${esc(d.store)}</p><p>訂購商品：${esc(d.product)}　　處理人員：${esc(d.therapist)}</p><p>實際已付款金額：新臺幣 ${money(d.paid)} 元　　協議退費比例：${esc(d.tier)}%</p><p><b>實際退費金額：新臺幣 ${money(amt())} 元</b></p><p>退款方式：${esc(d.refundMethod)}　　退款日期：${esc(d.refundDate)||'____年____月____日'}</p><p>本次協議處理事項：${esc(d.coveredDispute)}</p><h3>二、雙方協議與確認</h3><p>1. 本人已了解並<u>同意本次協議的退款金額、退款方式</u>及相關處理內容。</p><p>2. 雙方同意，於本次退款完成後，就本協議已涵蓋並處理的相同消費及退費事項，<u>原則上不再重複請求退款或補償</u>。但本協議未涵蓋的事項及依法不得排除的權利，不在此限。</p><p>3. 本次退費協議係<u>基於雙方善意、相互理解與諒解而達成</u>，不代表任何一方承認有故意或不當行為。</p><h3>三、一份真誠的心意</h3><p>對走四方而言，每一位顧客的信任都非常珍貴。</p><p>很抱歉，這次未能讓您獲得滿意的使用體驗，這也是我們在服務上仍有不足、需要繼續努力的地方。</p><p>我們也投入了許多時間與心力，希望能把每一次服務做好。雖然這次結果不如預期，仍非常感謝您願意與我們溝通，讓事情能夠在彼此理解中獲得妥善處理。</p><p>如果您認為我們還有哪些地方可以加強，或<u>對未來的服務有任何改善建議，也懇請您不吝指教</u>。</p><p>再次感謝您的理解與體諒，也祝福您一切順心。</p><h3>四、簽署確認</h3><p>本人已閱讀並理解上述內容，同意本次退費協議及處理方式。</p><div class="signature"><span>顧客簽名：________________</span><span>門市處理人員：________________</span></div><p>簽署日期：______ 年 ______ 月 ______ 日　退款狀態：□ 已完成　□ 待執行</p>`}
function printAgreement(){$('printArea').innerHTML=agreementHTML();window.print()}function kellyText(){let issues=[];if(d.invoice==='僅查得尾款發票')issues.push('僅查得尾款發票，訂金發票待確認');else if(d.invoice==='僅查得訂金發票')issues.push('僅查得訂金發票，尾款發票待確認');else if(d.invoice==='兩張皆暫時查不到')issues.push('訂金與尾款發票皆暫時查不到');if(!d.invoiceDone)issues.push('發票尚待財務確認');if(d.payment==='混合付款')issues.push('原付款為混合付款，請核對分筆退款');if(d.refundMethod==='其他／例外處理')issues.push('退款方式為例外處理，請核對退款憑證');let parts=[`Kelly，以下退費資料麻煩確認，謝謝！`,`\n【退費資料】`,`門市：${d.store||'未填'}`,`顧客：${d.customer||'未填'}`,`處理人員：${d.therapist||'未填'}`,`退款日期：${d.refundDate||'未填'}`,`\n原實付：NT$ ${money(d.paid)}`,`退款：${d.tier}%（NT$ ${money(amt())}）`,`公司保留：NT$ ${money(retained())}`,`退款方式：${d.refundMethod||'未填'}`,`\n退費原因：${d.reason.trim()||'未填'}`];if(issues.length)parts.push('\n【系統提醒】\n'+issues.map(x=>'・'+x).join('\n'));if(d.kellyExtraNote&&d.kellyExtraNote.trim())parts.push('\n特殊備註：'+d.kellyExtraNote.trim());return parts.join('\n')}async function copyKelly(){try{await navigator.clipboard.writeText(kellyText());alert('已複製，請貼到與 Kelly 的訊息並實際傳送。')}catch(e){let t=document.createElement('textarea');t.value=kellyText();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('已嘗試複製，請確認貼上內容。')}}function exportJSON(){const blob=new Blob([JSON.stringify({...d,refundAmount:amt(),retainedAmount:retained()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`退費紀錄_${d.store}_${d.customer||'未命名'}.json`;a.click();URL.revokeObjectURL(a.href)}function resetCase(){if(confirm('確定建立新案件？目前案件請先匯出備份。')){d={...defaults,offers:[]};save();render()}}render();
</script></body></html>
