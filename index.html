<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>走四方｜退費處理系統</title><style>
:root{--ink:#193b3d;--teal:#167e79;--pale:#e9f5f2;--bg:#f5f8f7;--line:#dbe6e3;--warn:#fff3dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#263b3b;font:16px/1.65 system-ui,-apple-system,'Noto Sans TC',sans-serif}header{background:var(--ink);color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}header h1{font-size:24px;margin:0}header p{margin:4px 0 0;color:#cfe5e1;font-size:14px}.wrap{max-width:1050px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:230px 1fr;gap:20px}aside,.panel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 20px #143f3910}aside{padding:20px;height:max-content;position:sticky;top:18px}aside h3{margin:0 0 15px;font-size:15px}aside .nav{padding:9px 10px;border-left:3px solid #dbe6e3;color:#6c8380;font-size:14px}aside .nav.active{border-color:var(--teal);color:var(--ink);font-weight:700;background:var(--pale)}.panel{padding:27px;min-height:570px}h2{font-size:23px;color:var(--ink);margin:0 0 10px}h3{font-size:17px;color:var(--ink)}.sub{color:#667e7b;margin-top:0}.tag{display:inline-block;background:var(--pale);color:var(--teal);padding:3px 11px;border-radius:100px;font-size:13px;font-weight:700;margin-bottom:12px}.notice{background:var(--pale);border-left:4px solid var(--teal);padding:13px 16px;border-radius:8px;margin:16px 0}.warn{background:var(--warn);border-left-color:#d58b1e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-weight:650;font-size:14px;margin:8px 0 4px}input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #bdceca;border-radius:8px;background:white;color:#253d3a}textarea{min-height:86px}button{cursor:pointer;font:inherit;border-radius:9px;border:1px solid #bdd5d0;padding:10px 16px;background:white;color:var(--ink);font-weight:650}button.primary{background:var(--teal);color:white;border-color:var(--teal)}u{text-underline-offset:3px;text-decoration-thickness:1px}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.choices{display:grid;gap:10px;margin:18px 0}.choice{border:1px solid var(--line);padding:13px;border-radius:10px;display:flex;gap:10px;align-items:center}.choice input{width:auto}.script{background:#f7faf9;border:1px solid var(--line);padding:17px;border-radius:10px;white-space:pre-line}.small{font-size:13px;color:#6d807e}.money{font-size:25px;font-weight:800;color:var(--teal)}.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0}.hidden{display:none!important}#printArea{display:none}@media(max-width:740px){.wrap{display:block;margin:12px auto}aside{position:static;margin-bottom:12px}.panel{padding:18px}.grid{grid-template-columns:1fr}header{padding:17px 20px}}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;background:white;color:#111;font:13px/1.6 'Noto Sans TC',sans-serif;padding:10mm}#printArea h1{text-align:center;font-size:20px}#printArea h2{text-align:center;font-size:16px}#printArea p{margin:7px 0}#printArea .signature{margin-top:22px;display:flex;justify-content:space-between}}
</style></head><body><header><h1>走四方｜退費處理系統</h1><p>門市治療師操作版 · 退費協商 → 文件 → 退款 → 發票 → 財務 Kelly</p></header><div class="wrap"><aside><h3>案件處理進度</h3><div id="nav"></div><hr style="border:0;border-top:1px solid #e5eeeb;margin:20px 0"><div class="small">資料儲存於目前瀏覽器；完成案件後請匯出備份。回報 Kelly 須由人員實際傳送。</div><button style="margin-top:15px;width:100%" onclick="exportJSON()">匯出案件備份</button><button style="margin-top:8px;width:100%" onclick="document.getElementById('importFile').click()">匯入案件備份</button><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importCase(this)"><button style="margin-top:8px;width:100%" onclick="resetCase()">建立新案件</button></aside><main class="panel" id="app"></main></div><div id="printArea"></div><script>
const stages=['案件資料','特殊爭議篩選','退費協商','退款及付款方式','退費協議書','發票處理','通知 Kelly／結案'];const key='just4fun_refund_v1';const defaults={step:0,branch:'',tier:50,offers:[],status:'進行中',screen:['','','',''],paid:0,deposit:3000,amount:0,customer:'',store:'',therapist:'',product:'',phone:'',date:'',purchaseDate:'',pickupDate:'',reason:'',payment:'',refundMethod:'',paymentNote:'',invoice:'',invoiceNote:'',invoiceOld:'',invoiceNew:'',refundDate:'',refundProof:'',refundDone:false,agreementSigned:false,invoiceDone:false,docsFiled:false,kellySent:false,supervisorNotified:false,supervisorApproved:false,supervisorNotes:'',customerDecision:'',considerDate:'',considerNote:'',refundIssues:'',coveredDispute:'本次鞋墊消費及退費金額爭議'};function fresh(){return {...defaults,screen:['','','',''],offers:[]}}function loadCase(){try{const v=JSON.parse(localStorage.getItem(key)||'null');return v&&typeof v==='object'&&!Array.isArray(v)?{...fresh(),...v,step:Math.max(0,Math.min(6,Number(v.step)||0)),screen:Array.isArray(v.screen)&&v.screen.length===4?v.screen:['','','',''],offers:Array.isArray(v.offers)?v.offers:[]}:fresh()}catch(e){return fresh()}}let d=loadCase();const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(key,JSON.stringify(d))}catch(e){if(!window.storageWarned){window.storageWarned=true;alert('瀏覽器無法儲存案件，請在離開前匯出 JSON 備份。')}}};function field(k){let e=$(k);if(e){d[k]=e.type==='checkbox'?e.checked:e.value;save()}}function bind(){document.querySelectorAll('[data-key]').forEach(e=>{e.addEventListener('change',()=>{field(e.dataset.key);render()});if(e.tagName==='INPUT'||e.tagName==='TEXTAREA')e.addEventListener('input',()=>field(e.dataset.key))})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function inp(k,title,type='text',extra=''){return `<div><label for="${k}">${title}</label><input id="${k}" data-key="${k}" type="${type}" value="${esc(d[k])}" ${extra}></div>`}function sel(k,title,opts){return `<div><label>${title}</label><select id="${k}" data-key="${k}"><option value="">請選擇</option>${opts.map(x=>`<option ${d[k]===x?'selected':''}>${x}</option>`).join('')}</select></div>`}function txt(k,title){return `<div><label>${title}</label><textarea id="${k}" data-key="${k}">${esc(d[k])}</textarea></div>`}function next(n){d.step=n;save();render();window.scrollTo(0,0)}function buttons(back,forward,disabled=false){return `<div class="actions">${back>=0?`<button onclick="next(${back})">← 上一步</button>`:''}<button class="primary" ${disabled?'disabled':''} onclick="next(${forward})">下一步 →</button></div>`}function money(n){return Math.round(Number(n)||0).toLocaleString('zh-TW')}function amt(){return Math.round((+d.paid||0)*(+d.tier||0)/100)}function retained(){return (+d.paid||0)-amt()}function render(){save();$('nav').innerHTML=stages.map((x,i)=>`<div class="nav ${i===d.step?'active':''}">${i+1}. ${x}</div>`).join('');let s='<span class="tag">STEP '+(d.step+1)+' / 7</span>';if(d.step===0){s+=`<h2>建立退費案件</h2><p class="sub">顧客已明確提出退款要求時，開始此流程。若僅反映不適，仍依一般售後服務處理。</p><div class="grid">${inp('customer','顧客姓名')}${sel('store','門市',['台北','板橋','竹北','台中','員林','台南'])}${inp('therapist','負責治療師')}${inp('phone','顧客電話')}${sel('product','鞋墊種類',['成人全訂製','兒童全訂製','成人半訂製','兒童半訂製','個人化半訂製','進階半訂製','其他'])}${inp('paid','實際已付款總金額（元）','number','min="0"')}${inp('deposit','其中訂金（元）','number','min="0"')}${inp('purchaseDate','訂購日期','date')}${inp('pickupDate','取件日期','date')}</div>${txt('reason','顧客提出退費的原因')}<div class="notice">請先讓主管知悉本案。50%～70%協商可依既定授權辦理；超過70%必須經主管核准。</div><label class="choice"><input type="checkbox" id="supervisorNotified" data-key="supervisorNotified" ${d.supervisorNotified?'checked':''}> 已通知主管知悉</label>${buttons(-1,1,!d.customer.trim()||!d.store||!d.therapist.trim()||!d.product||!(+d.paid>0)||+d.deposit<0||+d.deposit>+d.paid||!d.supervisorNotified)}`}
else if(d.step===1){const qs=['顧客是否反映使用鞋墊後，產生新的傷害或原有症狀明顯惡化？','是否曾向顧客保證特定改善效果？','是否發現明顯的鞋墊製作錯誤？','顧客是否在取件當下，就指出鞋墊與原本約定的製作內容不符？'];s+=`<h2>四項特殊爭議篩選</h2><p class="sub">每題請選擇「是／否／不確定」。這是風險分流，不是法律責任認定。</p>`+qs.map((q,i)=>`<div style="margin:17px 0"><label>${i+1}. ${q}</label><select onchange="d.screen[${i}]=this.value;save();render()"><option value="">請選擇</option>${['否','是','不確定'].map(v=>`<option ${d.screen[i]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('');const special=d.screen.some(x=>x==='是'||x==='不確定');s+=special?`<div class="notice warn">特殊爭議／待釐清：直接從70%協商開始，並保留相關紀錄。涉及疑似傷害、瑕疵或契約責任時，協商比例不是法定權利上限，須另行評估。</div>`:`<div class="notice">四項皆為「否」時，從50%開始協商。</div>`;s+=`<div class="actions"><button onclick="next(0)">← 上一步</button><button class="primary" ${d.screen.some(x=>!x)?'disabled':''} onclick="startNegotiation()">開始協商 →</button></div>`}
else if(d.step===2){const special=d.branch==='特殊爭議';s+=`<h2>退費協商｜${d.tier}%</h2><p class="sub">${special?'特殊爭議從70%開始；請另行記錄爭議及相關事證。':'一般案件依50% → 60% → 70%逐步協商；不必因一次拒絕就自動加碼。'}</p><div class="row"><span>實際已付款</span><b>NT$ ${money(d.paid)}</b></div><div class="row"><span>目前提出退款 ${d.tier}%</span><b class="money">NT$ ${money(amt())}</b></div><h3>建議溝通說詞</h3><div class="script">${scriptText()}</div>${d.tier===70&&!special?'<div class="notice">提出70%前，請實際離開接待區確認內部處理規範；不要聲稱已取得未曾發生的總公司核准。</div>':''}<h3>顧客回應</h3><div class="actions"><button class="primary" onclick="accept()">✓ 接受 ${d.tier}%</button><button onclick="reject()">✕ 不接受</button><button onclick="consider()">◷ 需要時間考慮</button></div>${d.status==='待顧客回覆'?`<div class="notice warn"><b>待顧客回覆</b><div class="grid">${inp('considerDate','預計追蹤日期','date')}${inp('considerNote','備註')}</div><button onclick="d.status='進行中';save();render()">顧客已回覆，繼續協商</button></div>`:''}${d.status==='待主管審核'?`<div class="notice warn"><b>超過70%需主管核准</b>${txt('supervisorNotes','主管處理紀錄／核准比例與金額')}<div class="grid">${inp('tier','主管核准退款比例（%）','number','min="0" max="100"')}<label class="choice"><input type="checkbox" id="supervisorApproved" data-key="supervisorApproved" ${d.supervisorApproved?'checked':''}> 已取得主管明確核准</label></div><button class="primary" onclick="approved()">確認主管核准並進入退款作業</button></div>`:''}<div class="actions"><button onclick="next(1)">← 返回篩選</button></div>`}
else if(d.step===3){s+=`<h2>退款金額與付款方式</h2><div class="row"><span>原實際付款</span><b>NT$ ${money(d.paid)}</b></div><div class="row"><span>協議退款比例</span><b>${d.tier}%</b></div><div class="row"><span>應退顧客</span><b class="money">NT$ ${money(amt())}</b></div><div class="row"><span>公司保留</span><b>NT$ ${money(retained())}</b></div><div class="grid">${sel('payment','原付款方式',['現金／銀行轉帳','信用卡','LINE Pay','台灣 Pay','混合付款'])}${sel('refundMethod','預計退款方式',['現金','銀行轉帳','原信用卡退刷','LINE Pay 原交易退款','台灣 Pay 原交易退款','其他／例外處理'])}</div>${txt('paymentNote','交易編號、授權碼、原付款拆分、平台退款限制及備註')}<div class="notice warn">信用卡、LINE Pay、台灣 Pay 的部分退款能力、期限及手續費，依實際收單機構與交易紀錄確認。無法依原交易退款時，請先取得主管／財務確認，不可自行改變已協議的退款金額。</div>${buttons(2,4,!d.payment||!d.refundMethod)}`}
else if(d.step===4){s+=`<h2>退費協議暨確認書</h2><p class="sub">系統自動帶入資料，列印 A4 供顧客閱讀、簽名。請在實際退款前完成。</p><div class="notice">文件將自動帶入：${esc(d.customer)}｜${esc(d.store)}｜${esc(d.product)}｜實付 NT$ ${money(d.paid)}｜退費 ${d.tier}%（NT$ ${money(amt())}）。</div>${txt('coveredDispute','本次協議涵蓋的爭議事項（特殊爭議請具體描述）')}<div class="actions"><button class="primary" onclick="printAgreement()">列印已填妥的退費協議書</button></div><label class="choice"><input type="checkbox" id="agreementSigned" data-key="agreementSigned" ${d.agreementSigned?'checked':''}> 已由顧客閱讀並簽署退費協議書</label>${buttons(3,5,!d.agreementSigned)}`}
else if(d.step===5){s+=`<h2>實際退款及電子發票</h2><p class="sub">現場治療師負責執行退款、保存交易憑證並處理發票。</p><div class="grid">${inp('refundDate','實際退款日期','date')}${inp('refundProof','退款交易編號／憑證號碼')}${sel('invoice','發票查詢狀態',['訂金與尾款發票皆可查得','僅查得尾款發票','僅查得訂金發票','兩張皆暫時查不到','單張發票／未分拆'])}${inp('invoiceOld','原發票號碼（可多筆）')}${inp('invoiceNew','新發票號碼／折讓單號')}</div>${txt('invoiceNote','發票處理說明／找不到訂金發票的查詢結果')}<div class="notice warn">公司原作法為「原發票作廢、重開保留金額」。但已開立或跨期的電子發票是否能作廢，應依實際交易及稅務規定確認；部分退款可能須折讓。找不到訂金發票時，先查電子發票紀錄，可先退款並標記「待 Kelly 確認」，不可將超過尾款發票金額的折讓硬套到尾款發票。</div><label class="choice"><input type="checkbox" id="refundDone" data-key="refundDone" ${d.refundDone?'checked':''}> 已依協議完成實際退款，並保存退款憑證</label><label class="choice"><input type="checkbox" id="invoiceDone" data-key="invoiceDone" ${d.invoiceDone?'checked':''}> 發票已依適用規則處理完成（若待財務確認，請勿勾選）</label>${buttons(4,6,!d.refundDone||!d.invoice||!d.refundDate||!d.refundProof.trim())}`}
else{let msg=kellyText();s+=`<h2>通知財務 Kelly／行政結案</h2><p class="sub">系統產生回報內容，由治療師複製並傳給 Kelly。此單機版不會自動傳送訊息。</p><div class="script" id="kellyText">${esc(msg)}</div><div class="actions"><button class="primary" onclick="copyKelly()">複製 Kelly 回報內容</button></div><label class="choice"><input type="checkbox" id="kellySent" data-key="kellySent" ${d.kellySent?'checked':''}> 已實際將上述內容傳給 Kelly</label><label class="choice"><input type="checkbox" id="docsFiled" data-key="docsFiled" ${d.docsFiled?'checked':''}> 已將簽署文件、退款憑證歸檔，並更新相關紀錄／績效表</label>${!d.invoiceDone?'<div class="notice warn">發票尚待財務確認：案件可標示「門市退款完成／待財務確認」，不可標記為全部結案。</div>':''}<div class="notice"><b>案件狀態：</b>${d.refundDone&&d.kellySent&&d.docsFiled?(d.invoiceDone?'全部結案':'門市退款完成／待財務確認'):'待完成行政作業'}</div><div class="actions"><button onclick="next(5)">← 上一步</button><button onclick="exportJSON()">匯出案件紀錄 JSON</button><button onclick="printAgreement()">重新列印協議書</button></div>`} $('app').innerHTML=s;bind()}
function startNegotiation(){d.branch=d.screen.some(x=>x!=='否')?'特殊爭議':'一般案件';d.tier=d.branch==='特殊爭議'?70:50;d.status='進行中';d.offers=[];next(2)}function scriptText(){if(d.branch==='特殊爭議')return '我們了解您這段時間使用鞋墊的情況沒有達到原本的期待，也知道您為此花了不少時間。這樣的結果，是雙方都不希望發生的。\n\n考量到您反映的問題，我們希望積極協助處理，因此先提出退還實際支付金額70%的協商方案。對於您提到的具體問題，我們也會另外留下紀錄並確認。\n\n請問您能接受這個處理方式嗎？';if(d.tier===50)return '很抱歉這次的鞋墊使用經驗沒有達到您的期待。我們知道您為了評估、取件和調整花了不少時間。\n\n因為鞋墊已依個別需求完成評估、設計與製作，材料、人力及後續調整也都已經投入成本。我們希望能用互相體諒的方式處理，先提出退還實際支付金額50%的方案。請問您覺得可以接受嗎？';if(d.tier===60)return '我們理解您的心情，也謝謝您願意繼續溝通。先前的評估、製作與調整確實已產生實際成本，但我們也知道您付出了時間。\n\n考量整體情況，我們可以進一步提供60%的退款方案。您覺得這樣可以接受嗎？';return '我們知道您已經為這件事往返、花了不少時間，這也不是雙方原本期待的結果。\n\n我先到後面確認一下公司目前的處理規範。〔員工實際查核後再回來〕\n\n我已確認門市目前可提供的最高協商比例是70%。公司也會承擔相當一部分已投入的評估、製作及調整成本，希望這次能以互相理解的方式妥善處理。請問您可以接受嗎？'}function accept(){if(d.status==='待主管審核'||+d.tier>70&&!d.supervisorApproved){alert('請先完成主管核准流程。');return}d.offers.push({tier:d.tier,result:'接受',time:new Date().toISOString()});d.status='已接受';next(3)}function reject(){d.offers.push({tier:d.tier,result:'不接受',time:new Date().toISOString()});if(+d.tier<70){d.tier=+d.tier===50?60:70;render()}else{d.status='待主管審核';render()}}function consider(){d.offers.push({tier:d.tier,result:'需要時間考慮',time:new Date().toISOString()});d.status='待顧客回覆';render()}function approved(){if(!d.supervisorNotes.trim()||!d.supervisorApproved||!(+d.tier>70&&+d.tier<=100)){alert('請填寫大於70%、不超過100%的核准比例，填寫處理紀錄，並確認主管已核准。');return}d.status='主管核准';next(3)}function agreementHTML(){return `<h1>走四方客製鞋墊</h1><h2>退費協議暨確認書</h2><p>親愛的顧客，您好：</p><p>謝謝您曾經選擇走四方，也謝謝您這段時間願意與我們一起努力，尋找適合您的鞋墊。每個人的足部狀況與穿著感受不同，即使經過評估、製作及調整，有時仍未能達到原本期待。對於這次的結果，我們感到遺憾；相信這是您與我們都不樂見的。</p><p>這段過程中，您付出了時間與耐心，我們也投入評估、設計、製作及服務的心力與成本。雖然結果未如預期，仍希望透過相互理解與體諒，為這次消費經驗畫下一個圓滿的句點。</p><h3>一、退費內容</h3><p>顧客：${esc(d.customer)}　　電話：${esc(d.phone)}　　門市：${esc(d.store)}</p><p>商品：${esc(d.product)}　　處理人員：${esc(d.therapist)}</p><p>實際已付款：NT$ ${money(d.paid)}　　協議退費比例：${esc(d.tier)}%</p><p><b>協議退費金額：NT$ ${money(amt())}</b>　　公司保留金額：NT$ ${money(retained())}</p><p>退款方式：${esc(d.refundMethod)}　　退款日期：${esc(d.refundDate)||'____________'}</p><p>本次協議處理事項：${esc(d.coveredDispute)}</p><h3>二、雙方協議與確認</h3><p>1. 雙方已就上述列明的消費及退費事項溝通，顧客了解並<u>同意本次協議的退款金額、退款方式</u>。</p><p>2. 於約定退款實際完成後，雙方同意本協議明確涵蓋的爭議已依約處理，就相同事項，<u>原則上不再重複請求退款或補償</u>；但未涵蓋事項及依法不得排除的權利不受限制。</p><p>3. 本協議係<u>基於雙方善意、相互理解與諒解而達成</u>，不當然代表任一方承認法律責任。</p><h3>三、一份真誠的心意</h3><p>對走四方而言，每位顧客的信任都很珍貴。我們尊重您對這段經驗的真實感受，也誠摯希望彼此以理解、善意與尊重事實的態度看待這次經歷，避免因誤解或不實資訊造成不必要的傷害。</p><p>很抱歉這次未能讓您獲得原本期待的穿著體驗，也謝謝您這段時間的耐心與溝通。若您<u>對未來的服務有任何改善建議，也懇請您不吝指教</u>。希望這件事能在彼此尊重中告一段落，祝福您一切順心。</p><p>本人已閱讀、理解並自願同意上述內容。</p><div class="signature"><span>顧客簽名：________________</span><span>門市人員：________________</span></div><p>簽署日期：_______年_______月_______日　退款狀態：□ 已完成　□ 待執行</p>`}function printAgreement(){$('printArea').innerHTML=agreementHTML();window.print()}function kellyText(){return `Kelly，這筆退費已處理，麻煩協助確認帳務，謝謝！\n門市：${d.store}\n顧客：${d.customer}\n治療師：${d.therapist}\n商品：${d.product}\n訂購／取件：${d.purchaseDate||'未填'}／${d.pickupDate||'未填'}\n退費原因：${d.reason||'未填'}\n案件類型：${d.branch}\n原實付：NT$ ${money(d.paid)}（訂金 NT$ ${money(d.deposit)}）\n退費比例：${d.tier}%\n實際退款：NT$ ${money(amt())}\n公司保留：NT$ ${money(retained())}\n原付款：${d.payment}\n退款方式：${d.refundMethod}\n退款日期：${d.refundDate||'未填'}\n退款憑證：${d.refundProof||'未填'}\n發票狀態：${d.invoice||'未填'}\n原發票：${d.invoiceOld||'未填'}\n新發票／折讓單：${d.invoiceNew||'未填'}\n發票處理：${d.invoiceDone?'已完成':'待財務確認'}\n發票備註：${d.invoiceNote||'無'}\n文件簽署：${d.agreementSigned?'已完成':'未完成'}\n退款憑證及文件：${d.docsFiled?'已歸檔':'待歸檔'}\n請協助確認，謝謝。`}async function copyKelly(){try{await navigator.clipboard.writeText(kellyText());alert('已複製，請貼到與 Kelly 的訊息並實際傳送。')}catch(e){let t=document.createElement('textarea');t.value=kellyText();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('已嘗試複製，請確認貼上內容。')}}function exportJSON(){const blob=new Blob([JSON.stringify({...d,refundAmount:amt(),retainedAmount:retained()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`退費紀錄_${d.store}_${d.customer||'未命名'}.json`;a.click();URL.revokeObjectURL(a.href)}async function importCase(input){try{const file=input.files[0];if(!file)return;const v=JSON.parse(await file.text());if(!v||Array.isArray(v)||typeof v!=='object'||typeof v.customer!=='string'||!Array.isArray(v.screen)||v.screen.length!==4||!v.screen.every(x=>['','是','否','不確定'].includes(x))||!Array.isArray(v.offers)||!Number.isFinite(+v.paid)||+v.paid<0||!Number.isFinite(+v.tier)||+v.tier<0||+v.tier>100)throw Error();if(!confirm('匯入將取代目前畫面的案件，請先確認目前案件已備份。'))return;const clean=fresh();Object.keys(clean).forEach(k=>{if(k in v&&typeof v[k]===typeof clean[k])clean[k]=v[k]});clean.paid=+v.paid;clean.tier=+v.tier;clean.deposit=Number.isFinite(+v.deposit)?+v.deposit:3000;clean.step=Math.max(0,Math.min(6,Math.trunc(+v.step)||0));d=clean;save();render()}catch(e){alert('無法匯入：請選擇本系統匯出的有效 JSON 案件檔。')}finally{input.value=''}}function resetCase(){if(confirm('確定建立新案件？目前案件請先匯出備份。')){d=fresh();save();render()}}render();
</script></body></html>
